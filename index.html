<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frascos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pedidos de Frascos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: management panel — sidebar on desktop, bottom bar on phone; Dashboard / Pedidos / Ventas / Clientes. Dark premium by default with a light variant, amber accent. */
:root{
  --bg:#0B0F19;--panel:#111827;--panel-2:#172033;--line:#1F2A3D;--line-2:#2A3850;
  --fg:#E8ECF4;--muted:#8A96AD;--dim:#5E6A82;
  --accent:#F59E0B;--accent-ink:#1A1103;--accent-soft:rgba(245,158,11,.13);--accent-text:#F59E0B;--hero-a:rgba(245,158,11,.16);--hero-b:rgba(245,158,11,.28);--shadow:rgba(0,0,0,.45);--overlay:rgba(3,6,12,.7);
  --ok:#34D399;--ok-soft:rgba(52,211,153,.13);--info:#60A5FA;--info-soft:rgba(96,165,250,.13);--bad:#F87171;--bad-soft:rgba(248,113,113,.13);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F4F5F8;--panel:#FFFFFF;--panel-2:#F2F4F8;--line:#E4E8EF;--line-2:#D4DAE4;--fg:#121826;--muted:#5A6377;--dim:#8891A4;
  --accent:#F59E0B;--accent-ink:#1A1103;--accent-soft:rgba(245,158,11,.14);--accent-text:#B45309;--hero-a:rgba(245,158,11,.18);--hero-b:rgba(217,119,6,.35);
  --ok:#059669;--ok-soft:rgba(5,150,105,.11);--info:#2563EB;--info-soft:rgba(37,99,235,.10);--bad:#DC2626;--bad-soft:rgba(220,38,38,.09);--shadow:rgba(17,24,39,.18);--overlay:rgba(17,24,39,.45);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F4F5F8;--panel:#FFFFFF;--panel-2:#F2F4F8;--line:#E4E8EF;--line-2:#D4DAE4;--fg:#121826;--muted:#5A6377;--dim:#8891A4;
  --accent:#F59E0B;--accent-ink:#1A1103;--accent-soft:rgba(245,158,11,.14);--accent-text:#B45309;--hero-a:rgba(245,158,11,.18);--hero-b:rgba(217,119,6,.35);
  --ok:#059669;--ok-soft:rgba(5,150,105,.11);--info:#2563EB;--info-soft:rgba(37,99,235,.10);--bad:#DC2626;--bad-soft:rgba(220,38,38,.09);--shadow:rgba(17,24,39,.18);--overlay:rgba(17,24,39,.45);color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;background:var(--bg)}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo .mk{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo .mk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo b{font-family:var(--f-display);font-size:16px;letter-spacing:-.02em;display:block;line-height:1.1}
.logo small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;text-align:left}
.nav button svg,.bnav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:var(--panel);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--accent-text)}
.nav .badge{margin-left:auto;font-family:var(--f-num);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.side .cta{margin-top:auto}
.side .themebtn{width:100%}
.themebtn svg{flex:none}
/* main */
.main{min-width:0;padding:24px 28px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.topbar h1{font-family:var(--f-display);font-size:24px;letter-spacing:-.03em;margin:0;text-wrap:balance}
.topbar p{margin:2px 0 0;color:var(--muted);font-size:13.5px}.topbar p::first-letter{text-transform:uppercase}
.clock{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.clock i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.clock.c2 i{background:var(--info)} .clock.c3 i{background:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--panel);color:var(--fg);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13.5px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.btn.w{width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{margin:0 0 14px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.hero-main{background:linear-gradient(135deg,var(--hero-a),transparent 60%),var(--panel);border-color:var(--hero-b);display:flex;flex-direction:column;gap:6px;justify-content:space-between}
.hero-main .lbl{font-size:13px;font-weight:700;color:var(--accent-text);text-transform:uppercase;letter-spacing:.08em}
.hero-main .big{font-family:var(--f-num);font-size:clamp(34px,6vw,50px);letter-spacing:-.04em;line-height:1.05}
.hero-main .sub{color:var(--muted);font-size:14px}
.hero-main .sub b{color:var(--ok);font-weight:700}
.hero-main .row-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--f-num);font-weight:500;font-size:24px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{font-size:12px;color:var(--dim)}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--accent-text)} .kpi.info b{color:var(--info)}
.two-col{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-top:14px}
.periods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .l{fill:var(--dim);font-family:var(--f-num);font-size:10.5px}
.chart .bv{fill:var(--accent);opacity:.28}
.chart .bg{fill:var(--accent)}
.chart .vt{fill:var(--fg);font-family:var(--f-num);font-size:10.5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:6px;vertical-align:-1px}
.legend i.v{opacity:.28}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0;padding-top:0}
.li .m{flex:1;min-width:0}
.li .t{font-weight:700;overflow-wrap:anywhere}
.li .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.li .r{text-align:right;font-family:var(--f-num);white-space:nowrap;font-size:14px}
.li .r small{display:block;font-size:11.5px;color:var(--ok)}
.hora{font-family:var(--f-num);font-size:12.5px;background:var(--panel-2);border-radius:8px;padding:5px 8px;color:var(--fg);flex:none;min-width:54px;text-align:center}
.empty{color:var(--muted);font-size:13.5px;padding:14px;border:1px dashed var(--line-2);border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;border:0}
.p-prep{background:var(--accent-soft);color:var(--accent-text)} .p-listo{background:var(--info-soft);color:var(--info)} .p-desp{background:var(--ok-soft);color:var(--ok)} .p-canc{background:var(--bad-soft);color:var(--bad)}
.p-pago{background:var(--ok-soft);color:var(--ok)} .p-cobrar{background:var(--bad-soft);color:var(--bad)} .p-wa{background:var(--panel-2);color:var(--fg);text-decoration:none}
/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 4px}
.col-h b{font-family:var(--f-display);font-size:14.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.col-h b i{width:8px;height:8px;border-radius:50%}
.col-h .c{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.col-h small{display:block;font-size:11.5px;color:var(--dim);font-weight:600}
.ped{background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ped.late{border-color:rgba(248,113,113,.5)}
.ped-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ped-top>div:first-child{min-width:0}
.ped-cli{font-weight:700;overflow-wrap:anywhere}
.ped-meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ped-tot{font-family:var(--f-num);white-space:nowrap;text-align:right}
.ped-what{font-size:13.5px;overflow-wrap:anywhere}
.ped-nota{font-size:12.5px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.ped-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ped-foot .sp{flex:1}
.armar{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:9px 10px}
.armar b{color:var(--fg)}
/* table */
.seg{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:11px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px;font-weight:700;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:0 10px 10px;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-num);white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel-2)}
.search{width:100%;max-width:360px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel)}
/* bottom nav (phone) */
.bnav{display:none}
.onb{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.onb h2{font-family:var(--f-display);margin:0;font-size:20px;letter-spacing:-.02em}
.onb p{margin:0;color:var(--muted);max-width:52ch}
.banner{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:14px}
@media (min-width:901px){.tema-m{display:none}}
@media (max-width:1100px){.hero,.two-col{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .board{grid-template-columns:minmax(0,1fr)}
  .periods{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .periods .card{padding:12px}.periods .kpi b{font-size:16px}
  .bnav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:center;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{white-space:nowrap;letter-spacing:-.01em;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:4px 0}
  .bnav button.on{color:var(--accent-text)}
  .bnav .fab{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:28px;margin-top:-24px;justify-self:center;box-shadow:0 8px 20px var(--shadow)}
  .topbar h1{font-size:21px}
  .hide-m{display:none}
}
@media (max-width:420px){.kpis{gap:10px}.kpi b{font-size:20px}.card{padding:14px}}
/* periodos + cobrar */
.nav .badge.bad{background:var(--bad);color:#fff}
.pnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.pnav .lab{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.02em;flex:1;min-width:160px}
.pnav .lab small{display:block;font-family:var(--f-body);font-weight:600;font-size:12.5px;color:var(--muted);letter-spacing:0}
.arrow{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-size:18px;line-height:1;display:grid;place-items:center}
.arrow:disabled{opacity:.35;cursor:default}
.cmp,.kpi .cmp{font-size:12px;font-weight:700;text-transform:none;letter-spacing:0}
.cmp.up{color:var(--ok)} .cmp.down{color:var(--bad)}
tr.dayrow td{background:var(--panel-2);font-weight:700;font-size:13px;padding:8px 10px;border-top:1px solid var(--line)}
tr.dayrow td .s{font-weight:600;color:var(--muted)}
.cob-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.cob-row:first-child{border-top:0;padding-top:0}
.cob-row .m{flex:1;min-width:160px}
.cob-row .t{font-weight:700;overflow-wrap:anywhere}
.cob-row .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.cob-row .amt{font-family:var(--f-num);font-size:16px;white-space:nowrap}
.cob-row .bt{display:flex;gap:6px;flex-wrap:wrap}
.age{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.age.old{background:var(--bad-soft);color:var(--bad)}
.quickd{display:flex;gap:6px;flex-wrap:wrap}
.quickd button{border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--muted)}
.quickd button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--line-2)}
/* respaldo */
.rsp{display:flex;flex-direction:column;gap:14px}
.rsp .card h4{margin:0 0 4px;font-size:15px}
.rsp .card p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.rsp-warn{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--hero-b);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:14px}
.prev{font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.prev b{font-family:var(--f-num)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* facturar */
.fac-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.fac-row:first-child{border-top:0}
.fac-row input{width:20px;height:20px;accent-color:var(--accent)}
.fac-row .t{font-weight:700;overflow-wrap:anywhere}
.fac-row .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.fac-row .r{text-align:right;font-family:var(--f-num);white-space:nowrap}
.fac-row .r small{display:block;font-size:11.5px;color:var(--muted)}
.fac-bar{position:sticky;bottom:12px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--hero-b);border-radius:14px;padding:12px 14px;margin-top:14px;box-shadow:0 10px 30px var(--shadow)}
.fac-bar b{font-family:var(--f-num)}
@media (max-width:900px){.fac-bar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
/* ranking */
.rk-row{display:grid;grid-template-columns:28px minmax(0,1fr) 92px 110px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.rk-row:first-child{border-top:0}
.rk-pos{font-family:var(--f-num);font-size:13px;color:var(--muted);text-align:center}
.rk-row.top .rk-pos{color:var(--accent-text);font-weight:700}
.rk-n{font-weight:700;overflow-wrap:anywhere}
.rk-s{font-size:12px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;align-items:center}
.rk-s .pill{font-size:11px;padding:2px 7px;background:var(--panel-2);color:var(--muted)}
.rk-bar{height:6px;border-radius:3px;background:var(--panel-2);margin-top:7px;overflow:hidden}
.rk-bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.rk-u{text-align:right;font-family:var(--f-num);white-space:nowrap}
.rk-u small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-body)}
.rk-g{text-align:right;font-family:var(--f-num);white-space:nowrap;color:var(--ok)}
.rk-g small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-body)}
@media (max-width:560px){.rk-row{grid-template-columns:22px minmax(0,1fr) auto}.rk-g{display:none}}
.mini-seg{display:inline-flex;gap:2px;background:var(--panel-2);border-radius:8px;padding:3px}
.mini-seg button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:4px 9px;border-radius:6px;text-transform:none;letter-spacing:0}
.mini-seg button.on{background:var(--panel);color:var(--fg)}
.var-row{display:grid;grid-template-columns:minmax(0,1fr) 60px minmax(0,170px);gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.var-row:first-child{border-top:0}

/* hero ventas */
.vhero{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:14px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.vh{display:flex;flex-direction:column;gap:4px;text-align:left;border:0;background:var(--panel);padding:20px 22px;cursor:pointer;position:relative;min-width:0}
.vh+.vh{border-left:1px solid var(--line)}
.vh .lbl{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.vh .big{font-family:var(--f-num);font-size:clamp(28px,5.2vw,46px);letter-spacing:-.04em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh .alt{font-family:var(--f-num);font-size:14px;color:var(--muted)}
.vh .sub{font-size:13px;color:var(--muted)}

.vh.on{background:linear-gradient(160deg,var(--hero-a),transparent 70%),var(--panel)}
.vh.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}

.eq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-num);font-size:18px}

.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}

/* items venta */
#v-items{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:minmax(0,1fr) 72px 100px 100px 30px;gap:6px;align-items:end;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:8px}

form{display:flex;flex-direction:column;gap:14px}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=v=>{let s=String(v??'').trim().replace(/\$/g,'').replace(/\s/g,'');if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/[.,](?=\d{3}(\D|$))/g,'');const n=parseFloat(s);return isFinite(n)?n:0};
const pesos=n=>(n<0?'-$':'$')+Math.abs(Math.round(n||0)).toLocaleString('es-AR');
const DOL={valor:0,tipo:'Blue',fecha:''};
let MON='ars';try{MON=localStorage.getItem('fr-mon')||'ars'}catch(e){}
const enUsd=()=>MON==='usd'&&DOL.valor>0;
const dolares=n=>{const u=(n||0)/DOL.valor,a=Math.abs(u);return(u<0?'-':'')+'US$ '+a.toLocaleString('es-AR',{minimumFractionDigits:a<100?2:0,maximumFractionDigits:a<100?2:0})};
const money=n=>enUsd()?dolares(n):pesos(n);
const otra=n=>DOL.valor>0?(enUsd()?'≈ '+pesos(n):'≈ '+dolares(n)):'';
const ejeMon=v=>(enUsd()?'US$':'$')+kf(enUsd()?v/DOL.valor:v);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy=()=>ymd(new Date());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const fLarga=s=>pd(s).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
const fCorta=s=>pd(s).toLocaleDateString('es-AR',{day:'numeric',month:'short'});
const ENT={encuentro:'Punto de encuentro',envio:'Envío',retira:'Retira'};
const PAGO={efectivo:'Efectivo',transferencia:'Transferencia',mp:'Mercado Pago'};
const EST={preparar:['Por preparar','p-prep'],listo:['Listo para despachar','p-listo'],despachado:['Despachado','p-desp'],cancelado:['Cancelado','p-canc']};

const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function temaActual(){const a=document.documentElement.getAttribute('data-theme');if(a)return a;return matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
function pintarTema(){const t=temaActual();const d=document.getElementById('tema-d');if(d)d.innerHTML=t==='light'?MOON+'<span>Modo oscuro</span>':SUN+'<span>Modo claro</span>';document.querySelectorAll('.tema-m:not(.rsp-m)').forEach(b=>{b.innerHTML=t==='light'?MOON:SUN;b.setAttribute('aria-label',t==='light'?'Modo oscuro':'Modo claro')})}
try{const t=localStorage.getItem('fr-tema');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
const S={rk:'u',alias:{},f:[],fx:new Set(),v:[],tab:'dash',per:'semana',po:0,q:'',ready:false,db:null,off:false};
try{S.tab=localStorage.getItem('fr-tab')||'dash'}catch(e){}

const gan=x=>(x.total||0)-(x.costo||0);
const itemsDe=x=>Array.isArray(x.items)&&x.items.length?x.items:[{producto:x.producto||'',cant:x.cant||0,total:x.total||0,costo:x.costo||0}];
const itemsTxt=x=>itemsDe(x).map(i=>(i.cant?i.cant+'× ':'')+(i.producto||'')).join(' · ');
const activas=()=>S.v.filter(x=>x.estado!=='cancelado');
const telD=t=>String(t||'').replace(/\D/g,'');
function wa(t){let d=telD(t);if(!d)return'';if(d.startsWith('0'))d=d.slice(1);if(!d.startsWith('54'))d='549'+d;return'https://wa.me/'+d}
const kCli=x=>{const d=telD(x.tel);return d?'t'+d.slice(-10):'n'+String(x.cliente||'').trim().toLowerCase()};
const byHora=(a,b)=>(a.hora||'99').localeCompare(b.hora||'99')||(a.creado||0)-(b.creado||0);
function sum(arr){let t=0,g=0,c=0;for(const x of arr){t+=x.total||0;g+=gan(x);if(!x.pagado)c+=x.total||0}return{t,g,c,n:arr.length}}
function rango(p){const t=hoy(),d=pd(t);
  if(p==='hoy')return[t,t];
  if(p==='semana'){const w=(d.getDay()+6)%7;return[addD(t,-w),t]}
  if(p==='mes')return[ymd(new Date(d.getFullYear(),d.getMonth(),1)),t];
  if(p==='mesant')return[ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),ymd(new Date(d.getFullYear(),d.getMonth(),0))];

const enRango=(x,[a,b])=>x.fecha>=a&&x.fecha<=b;
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function rangoOff(p,off){const t=hoy(),d=pd(t);
  if(p==='dia'){const x=addD(t,off);return[x,x]}
  if(p==='semana'){const w=(d.getDay()+6)%7,a=addD(t,-w+7*off);return[a,addD(a,6)]}
  if(p==='mes'){const a=new Date(d.getFullYear(),d.getMonth()+off,1),b=new Date(d.getFullYear(),d.getMonth()+off+1,0);return[ymd(a),ymd(b)]}
  return['0000-00-00','9999-99-99']}
function etiqueta(p,off,[a,b]){
  if(p==='dia')return[off===0?'Hoy':off===-1?'Ayer':fLarga(a).replace(/^./,c=>c.toUpperCase()),off<=-2?'':fLarga(a)];
  if(p==='semana')return[off===0?'Esta semana':off===-1?'Semana pasada':'Semana del '+pd(a).getDate(),'Del '+fCorta(a)+' al '+fCorta(b)];
  if(p==='mes'){const m=pd(a);return[(off===0?'Este mes · ':off===-1?'Mes pasado · ':'')+MES[m.getMonth()].replace(/^./,c=>c.toUpperCase()),String(m.getFullYear())]}

function nice(m){if(m<=0)return 1000;const p=10**Math.floor(Math.log10(m)),f=m/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
const kf=n=>n>=1e6?(n/1e6).toFixed(1).replace('.0','').replace('.',',')+'M':n>=1e3?Math.round(n/1e3)+'k':String(Math.round(n));
function chart(dv){const W=600,H=230,L=46,R=6,T=22,B=26,mx=nice(Math.max(...dv.map(x=>x.v),0)),ih=H-T-B,iw=W-L-R,sl=iw/dv.length,bw=Math.min(22,sl*.3);
  const y=v=>T+ih-v/mx*ih;let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Venta y ganancia de los últimos 7 días">';
  for(let i=0;i<=4;i++){const v=mx*i/4,yy=y(v);s+='<line class="g" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text class="l" x="'+(L-8)+'" y="'+(yy+3.5)+'" text-anchor="end">'+(i?ejeMon(v):'0')+'</text>'}
  dv.forEach((x,i)=>{const cx=L+sl*i+sl/2,last=i===dv.length-1;
    if(x.v>0){s+='<rect class="bv" x="'+(cx-bw-1)+'" y="'+y(x.v)+'" width="'+bw+'" height="'+(T+ih-y(x.v))+'" rx="3"/>';if(last)s+='<text class="vt" x="'+cx+'" y="'+(y(x.v)-7)+'" text-anchor="middle">'+ejeMon(x.v)+'</text>'}
    if(x.g>0)s+='<rect class="bg" x="'+(cx+1)+'" y="'+y(x.g)+'" width="'+bw+'" height="'+(T+ih-y(x.g))+'" rx="3"/>';
    s+='<text class="l" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle"'+(last?' style="fill:var(--fg)"':'')+'>'+(last?'Hoy':pd(x.d).toLocaleDateString('es-AR',{weekday:'short'}).replace('.',''))+'</text>'});
  return s+'</svg>'}

function chartP(dv,P){const W=640,H=220,L=48,R=6,T=22,B=26,mx=nice(Math.max(...dv.map(x=>x.v),0)),ih=H-T-B,iw=W-L-R,sl=iw/dv.length,bw=Math.max(2,Math.min(20,sl*.32));

/* ---------- productos más vendidos ---------- */
const STOP=new Set(['frasco','frascos','botella','botellas','de','del','con','sin','tapa','tapas','x','el','la','los','las','para','y','c','s','cc','ml','gr','grs','unidades','unid','u','vidrio','envase','envases','pack','caja','cajas']);
const COLORES=new Set(['blanca','blanco','negra','negro','dorada','dorado','plateada','plateado','roja','rojo','verde','azul','gris','cromada','cromado','metalica','transparente']);
const sinAcento=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const sing=w=>w.length>4&&/[^aeiou]es$/.test(w)&&!/(tes|des)$/.test(w)?w.slice(0,-2):w.length>3&&w.endsWith('s')?w.slice(0,-1):w;
const cap=s=>s.replace(/(^|\s)\S/g,c=>c.toUpperCase());
function parte(txt){
  const t=sinAcento(String(txt).toLowerCase()).replace(/(\d)\s*(cc|ml|gr|g)\b/g,'$1').replace(/[^a-z0-9ñ ]+/g,' ');
  const w=t.split(/\s+/).filter(Boolean);
  let capac=null,model=[],tapa=null;
  for(let i=0;i<w.length;i++){const x=w[i];
    if(/^\d+$/.test(x)){if(i===0&&w.slice(1).some(y=>/^\d+$/.test(y)))continue;const n=+x;if(n>=50&&n<=5000)capac=capac?Math.max(capac,n):n;continue}
    if(x==='sin'&&w[i+1]&&w[i+1].startsWith('tapa')){tapa='sin tapa';i++;continue}
    if(x.startsWith('tapa')&&w[i+1]&&COLORES.has(w[i+1])){tapa='tapa '+w[i+1].replace(/o$/,'a');i++;continue}
    if(COLORES.has(x)){if(!tapa)tapa='tapa '+x.replace(/o$/,'a');continue}
    if(STOP.has(x))continue;
    model.push(sing(x))}
  if(!tapa&&/con tapa/.test(t))tapa='con tapa';
  return{model:model.join(' '),capac,tapa}
}
function agrupar(ventas,alias={}){
  const partes=[];
  for(const vv of ventas)for(const v of itemsDe(vv)){const raw=String(v.producto||'').trim();if(!raw)continue;
    const trozos=raw.split(/\s*(?:\/|\+|\by\b|,)\s*/i).filter(s=>s.trim());
    const ps=(trozos.length?trozos:[raw]).map(t=>Object.assign(parte(t),{raw:t.trim()}));
    ps.forEach(p=>partes.push({v,p,frac:1/ps.length,comb:ps.length>1}))}
  // inferir: capacidad mas comun por modelo; modelo unico por capacidad
  const capPorModelo={},modPorCap={};
  for(const {p} of partes){if(p.model&&p.capac){(capPorModelo[p.model]=capPorModelo[p.model]||{})[p.capac]=((capPorModelo[p.model]||{})[p.capac]||0)+1;(modPorCap[p.capac]=modPorCap[p.capac]||new Set()).add(p.model)}}
  const G={};
  for(const {v,p,frac,comb} of partes){
    let m=p.model,c=p.capac;
    if(!m&&c&&modPorCap[c]&&modPorCap[c].size===1)m=[...modPorCap[c]][0];
    if(m&&!c&&capPorModelo[m]){c=+Object.entries(capPorModelo[m]).sort((a,b)=>b[1]-a[1])[0][0]}
    let nombre=(m?cap(m):'Frasco')+(c?' '+c:'');
    const k=sinAcento(p.raw.toLowerCase()).replace(/\s+/g,' ');
    if(alias[k])nombre=alias[k];
    const g=G[nombre]||(G[nombre]={nombre,u:0,n:0,t:0,g:0,comb:false,tapas:{},raws:{}});
    const lead=String(v.producto||'').trim().match(/^(\d+)\s*x?\s+[a-z]/i);const u=(v.cant||(lead?+lead[1]:0))*frac;g.u+=u;g.n+=frac;g.t+=(v.total||0)*frac;g.g+=((v.total||0)-(v.costo||0))*frac;if(comb)g.comb=true;
    if(p.tapa)g.tapas[p.tapa]=(g.tapas[p.tapa]||0)+u;g.raws[k]=(g.raws[k]||{txt:p.raw,u:0});g.raws[k].u+=u}
  for(const g of Object.values(G)){const rs=Object.keys(g.raws);if(!/^botella/i.test(g.nombre)&&rs.filter(r=>/botella/.test(r)).length*2>=rs.length&&!Object.values(alias).includes(g.nombre))g.nombre='Botella '+g.nombre.replace(/^./,c=>c.toLowerCase())}
  return Object.values(G).sort((a,b)=>b.u-a.u)
}

const kRaw=t=>sinAcento(String(t).toLowerCase()).replace(/\s+/g,' ').trim();
function rankingHTML(ventas,lim,titulo,compact){

  const mx=Math.max(...list.map(g=>g[key]),1),totU=gs.reduce((a,g)=>a+g.u,0);const comb=list.some(g=>g.comb);

function aFecha(v){if(v==null||v==='')return'';if(v instanceof Date&&!isNaN(v))return ymd(new Date(v.getTime()+6*36e5));

  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad(+m[2])+'-'+pad(+m[1])}
  if(/^\d{5}$/.test(s)){const d=new Date(Date.UTC(1899,11,30)+(+s)*864e5);return d.toISOString().slice(0,10)}return''}

function leerArchivo(file){return new Promise((ok,ko)=>{const fr=new FileReader();fr.onerror=()=>ko(new Error('No se pudo leer el archivo'));
  fr.onload=()=>{try{
    if(/\.json$/i.test(file.name)){const j=JSON.parse(new TextDecoder().decode(fr.result));const arr=Array.isArray(j)?j:j.ventas||[];return ok(arr.map(x=>({id:idOk(String(x.id||''))?String(x.id):'',d:Object.assign({},x,{id:undefined})})).filter(x=>x.d.fecha))}
    if(typeof XLSX==='undefined')return ko(new Error('No se pudo cargar el lector de Excel. Recargá el panel.'));
    const wb=XLSX.read(fr.result,{type:'array',cellDates:true});const sh=wb.Sheets['Ventas']||wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sh,{defval:'',raw:true});
    if(!rows.length||!('Fecha' in rows[0])||!('Producto' in rows[0]))return ko(new Error('Este archivo no parece un respaldo del panel (no tiene las columnas Fecha y Producto).'));
    const lista=rows.map(filaAVenta).filter(Boolean);const ish=wb.Sheets['Productos por venta'];if(ish){const byId={};for(const r of XLSX.utils.sheet_to_json(ish,{defval:''})){const id=String(r['ID venta']).trim();if(!id)continue;(byId[id]=byId[id]||[]).push({producto:String(r['Producto']).trim(),cant:Math.round(nm(r['Cantidad'])),total:typeof r['Cobrás']==='number'?r['Cobrás']:nm(r['Cobrás']),costo:typeof r['Te costó']==='number'?r['Te costó']:nm(r['Te costó'])})}for(const it of lista)if(it.id&&byId[it.id])it.d.items=byId[it.id]}
    ok(lista)}catch(e){ko(new Error('No se pudo leer el archivo: '+e.message))}};fr.readAsArrayBuffer(file)})}
async function prepararRestauracion(file){
  if(/\.json$/i.test(file.name)){try{const j=JSON.parse(await file.text());if(j&&j.formato==='frascos-completo')return importarCompleto(j)}catch(e){$('#rsp-prev').innerHTML='<div class="banner" style="margin:0">El archivo no es una copia válida.</div>';return}}

  if(!items.length){box.innerHTML='<div class="banner" style="margin:0">El archivo no tiene ventas para cargar.</div>';return}
  const ids=new Set(S.v.map(x=>x.id));const nuevas=items.filter(x=>!x.id||!ids.has(x.id)),exist=items.filter(x=>x.id&&ids.has(x.id));

   (exist.length?'<label class="chk" style="font-size:13px"><input type="checkbox" id="rsp-reemp"> Reemplazar también esas '+exist.length+' con los datos del archivo</label>':'')+
   '<p style="margin:4px 0 0;color:var(--muted);font-size:12.5px">Cargar un respaldo nunca borra ventas del panel.</p>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn pri" id="rsp-go"'+(nuevas.length||exist.length?'':' disabled')+'>Cargar respaldo</button><button class="btn" data-act="respaldo">Cancelar</button></div></div>';
  $('#rsp-go').onclick=async()=>{const reemp=$('#rsp-reemp')&&$('#rsp-reemp').checked;const lista=reemp?items:nuevas;if(!lista.length){toast('No hay nada nuevo para cargar');return}
    const go=$('#rsp-go');go.disabled=true;let ok=0,fail=0;
    for(let i=0;i<lista.length;i+=5){const parte=lista.slice(i,i+5);
      const res=await Promise.all(parte.map(x=>{const ref=x.id?S.db.collection('ventas').doc(x.id):S.db.collection('ventas').doc();return ref.set(x.d).then(()=>1,()=>0)}));
      res.forEach(r=>r?ok++:fail++);go.textContent='Cargando… '+(ok+fail)+'/'+lista.length}
    toast(fail?('Se cargaron '+ok+' ventas, fallaron '+fail+'. Probá de nuevo con el mismo archivo.'):('Listo: se cargaron '+ok+' ventas'));if(!fail)closeM();else go.disabled=false}
}

  else if(a==='cobrado'&&x){await save(()=>S.db.collection('ventas').doc(id).update({pagado:true,fechaPago:hoy()}),'Cobrado: '+money(x.total))}
  else if(a==='borrar'){openM('¿Borrar esta venta?','<p style="margin:0 0 14px;color:var(--muted)">Si el cliente se bajó, mejor marcala como Cancelada así queda registrado. Borrar la elimina del todo.</p><div class="acts"><button class="btn" data-act="cerrar">Volver</button><button class="btn danger" id="ok-del">Sí, borrar</button></div>',()=>{$('#ok-del').onclick=async()=>{if(await save(()=>S.db.collection('ventas').doc(id).delete(),'Venta borrada'))closeM()}})}
  else if(a==='ruta'){const t=ruta();try{await navigator.clipboard.writeText(t);toast('Hoja de ruta copiada')}catch(_){openM('Hoja de ruta','<textarea class="route" id="rt" readonly>'+esc(t)+'</textarea>',()=>{$('#rt').select()})}}
  else if(a==='cliente'){const c=clientes().find(c=>c.k===b.dataset.k);if(!c)return;const w=wa(c.tel);
    openM(c.nombre||'Cliente','<div class="r2" style="margin-bottom:12px"><div class="card kpi"><span>Compró</span><b>'+money(c.t)+'</b></div><div class="card kpi ok"><span>Te dejó</span><b>'+money(c.g)+'</b></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'+(w?'<a class="btn" href="'+w+'" target="_blank" rel="noopener">Abrir WhatsApp</a>':'')+'<button class="btn pri" data-act="nuevacli" data-k="'+esc(c.k)+'">Nueva venta</button></div><div class="card"><div class="list">'+c.v.sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(v=>'<button class="li" data-act="editar" data-id="'+v.id+'"><span class="hora">'+esc(fCorta(v.fecha))+'</span><div class="m"><div class="t">'+esc(itemsTxt(v))+'</div></div><div class="r">'+money(v.total)+'</div></button>').join('')+'</div></div>')}
  else if(a==='nuevacli'){const c=clientes().find(c=>c.k===b.dataset.k);const last=c&&c.v.sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];formVenta(null,{cliente:c?c.nombre:'',tel:c?c.tel:'',entrega:last?last.entrega:'encuentro',lugar:last?last.lugar:''})}
});
document.addEventListener('input',e=>{if(e.target.id==='cli-q'){S.q=e.target.value;cliList()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeM()});

/* ---------- arrastrar tarjetas ---------- */
const D={card:null,id:null,ghost:null,sx:0,sy:0,on:false,timer:null,touch:false,over:null,ox:0,oy:0,just:false};
function colAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest('.col[data-col]')}
function startDrag(){const r=D.card.getBoundingClientRect();D.ox=D.sx-r.left;D.oy=D.sy-r.top;D.on=true;
  D.ghost=D.card.cloneNode(true);D.ghost.classList.add('dragghost');D.ghost.style.width=r.width+'px';D.ghost.style.left=r.left+'px';D.ghost.style.top=r.top+'px';document.body.appendChild(D.ghost);D.card.classList.add('dragging');
  try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}}
function moveDrag(x,y){D.ghost.style.left=(x-D.ox)+'px';D.ghost.style.top=(y-D.oy)+'px';const c=colAt(x,y);if(c!==D.over){D.over&&D.over.classList.remove('drop');D.over=c;c&&c.classList.add('drop')}
  if(y<70)scrollBy(0,-14);else if(y>innerHeight-110)scrollBy(0,14)}
async function endDrag(){clearTimeout(D.timer);const wasOn=D.on,id=D.id,over=D.over;
  D.ghost&&D.ghost.remove();D.card&&D.card.classList.remove('dragging');D.over&&D.over.classList.remove('drop');Object.assign(D,{card:null,id:null,ghost:null,on:false,over:null});
  if(!wasOn)return;D.just=true;setTimeout(()=>D.just=false,0);
  if(!over)return;const to=over.dataset.col,x=S.v.find(v=>v.id===id);if(!x||x.estado===to)return;
  const prev=x.estado;x.estado=to;render();
  const ok=await save(()=>S.db.collection('ventas').doc(id).update({estado:to}),to==='despachado'?'Despachado':to==='listo'?'Listo para despachar':'Volvió a Por preparar');if(!ok){x.estado=prev;render()}}
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.ped[data-drag]');if(!c||e.target.closest('button,a')||e.button>0)return;
  D.card=c;D.id=c.dataset.drag;D.sx=e.clientX;D.sy=e.clientY;D.touch=e.pointerType!=='mouse';
  if(D.touch)D.timer=setTimeout(()=>{if(D.card)startDrag()},280)});
document.addEventListener('pointermove',e=>{if(!D.card)return;
  if(!D.on){const dist=Math.hypot(e.clientX-D.sx,e.clientY-D.sy);if(D.touch){if(dist>10){clearTimeout(D.timer);D.card=null}return}if(dist>6)startDrag();else return}
  e.preventDefault();moveDrag(e.clientX,e.clientY)});
document.addEventListener('touchmove',e=>{if(D.on)e.preventDefault()},{passive:false});
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',()=>{if(D.on)endDrag();else{clearTimeout(D.timer);D.card=null}});
document.addEventListener('contextmenu',e=>{if(D.card)e.preventDefault()});
document.addEventListener('click',e=>{if(D.just){e.stopPropagation();e.preventDefault()}},true);

render();
setTimeout(()=>{if(!S.ready){S.ready=true;render()}},4000);
(async()=>{let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(_){}
  if(!db){S.off=true;S.ready=true;render();return}S.db=db;leerUltimo();
  db.collection('ventas').get().then(s=>{if(!S.ready||!S.v.length){S.v=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.ready=true;render()}}).catch(()=>{S.ready=true;render()});
  const sub=()=>db.collection('ventas').onSnapshot(s=>{S.v=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.ready=true;render()},err=>{S.ready=true;render();if(err&&err.code==='unavailable')setTimeout(sub,3000)});
  sub();
  const subF=()=>db.collection('facturas').onSnapshot(s=>{S.f=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.ready)render()},err=>{if(err&&err.code==='unavailable')setTimeout(subF,3000)});
  subF();
  try{db.doc('meta/dolar').onSnapshot(d=>{if(d.exists)Object.assign(DOL,d.data());if(S.ready)render()},()=>{})}catch(_){}
  try{db.doc('meta/productos').onSnapshot(d=>{S.alias=(d.exists&&d.data().alias)||{};if(S.ready)render()},()=>{})}catch(_){}
  })();
</script>
